<div class="modal-backdrop" (click)="cancel.emit()">
  <div class="modal-card" (click)="$event.stopPropagation()">

    <div class="modal-icon success">
      <mat-icon>check_circle</mat-icon>
    </div>

    <h2 class="modal-title">Approve Enrollment</h2>

    <p class="modal-desc">
      Are you sure you want to approve <strong>"{{ studentName }}"</strong> for the course <strong>"{{ courseTitle
        }}"</strong>?
      An automated email will be sent to the student upon approval.
    </p>

    <div class="modal-actions">
      <button class="btn btn-outline" (click)="cancel.emit()" [disabled]="isProcessing">Cancel</button>
      <button class="btn btn-success" (click)="confirm.emit()" [disabled]="isProcessing">
        @if (isProcessing) {
        <mat-icon class="spinner">autorenew</mat-icon>
        Approving...
        } @else {
        Approve Student
        }
      </button>
    </div>

  </div>
</div>
