<div class="modal-backdrop" (click)="cancel.emit()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    
    <div class="modal-icon danger">
      <mat-icon>cancel</mat-icon>
    </div>

    <h2 class="modal-title">Reject Enrollment</h2>
    
    <p class="modal-desc">
      You are about to reject the enrollment for <strong>"{{ studentName }}"</strong>. 
      Please provide a reason. This will be sent to the student via email.
    </p>

    <div class="input-wrapper">
      <textarea 
        [(ngModel)]="reason" 
        rows="3" 
        placeholder="e.g. Incorrect NIC provided, Course prerequisites not met..."
        [disabled]="isProcessing">
      </textarea>
    </div>

    <div class="modal-actions">
      <button class="btn btn-outline" (click)="cancel.emit()" [disabled]="isProcessing">Cancel</button>
      <button class="btn btn-danger" (click)="onSubmit()" [disabled]="isProcessing || !reason.trim()">
        @if (isProcessing) {
          <mat-icon class="spinner">autorenew</mat-icon>
          Rejecting...
        } @else {
          Reject Student
        }
      </button>
    </div>

  </div>
</div>
