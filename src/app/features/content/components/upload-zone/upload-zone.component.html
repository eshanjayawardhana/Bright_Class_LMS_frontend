<div class="upload-zone-wrapper">
  <label class="upload-zone" 
         [class.dragging]="isDragging"
         (dragover)="onDragOver($event)"
         (dragleave)="onDragLeave($event)"
         (drop)="onDrop($event)">
         
    <input type="file" hidden multiple (change)="onFileChange($event)" accept=".pdf,.doc,.docx,.ppt,.pptx,.zip" />

    <div class="upload-content">
      <div class="upload-icon">
        <mat-icon>cloud_upload</mat-icon>
      </div>
      <p class="upload-text"><strong>Click to upload</strong> or drag and drop</p>
      <p class="upload-hint">PDF, DOCX, PPTX or ZIP (You can select multiple files)</p>
    </div>
  </label>

  @if (selectedFiles.length > 0) {
    <div class="selected-files-list">
      @for (file of selectedFiles; track file.name; let i = $index) {
        <div class="file-item">
          <mat-icon class="file-icon">description</mat-icon>
          <span class="file-name">{{ file.name }}</span>
          <button type="button" class="remove-btn" (click)="removeFile(i)" title="Remove file">
            <mat-icon>close</mat-icon>
          </button>
        </div>
      }
    </div>
  }
</div>
