<div class="modal-backdrop" (click)="cancel.emit()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    
    <div class="modal-icon success">
      <mat-icon>verified</mat-icon>
    </div>

    <h2 class="modal-title">Verify Payment</h2>
    
    <p class="modal-desc">
      You are about to officially verify the payment slip uploaded by <strong>"{{ studentName }}"</strong> for the course <strong>"{{ courseTitle }}"</strong>.
    </p>

    <div class="summary-box">
      <span class="summary-label">Amount Verified</span>
      <strong class="summary-value">Rs. {{ amount | number:'1.2-2' }}</strong>
    </div>

    <div class="modal-actions">
      <button class="btn btn-outline" (click)="cancel.emit()" [disabled]="isProcessing">Cancel</button>
      <button class="btn btn-success" (click)="confirm.emit()" [disabled]="isProcessing">
        @if (isProcessing) {
          <mat-icon class="spinner">autorenew</mat-icon>
          Verifying...
        } @else {
          Confirm Verification
        }
      </button>
    </div>

  </div>
</div>
